# The quality gate, run automatically.
#
# Four documents and the runner's own help text said "continuous integration runs
# the same command, so there is no second definition of pass". That was not true:
# there was no continuous integration at all, so every rule this repository calls
# non-negotiable held only when somebody remembered to run the script. This file is
# what makes those sentences true, which is why it runs scripts/Invoke-Tests.ps1
# rather than reimplementing the checks - a second definition of "pass" is the thing
# being avoided.
name: quality gate

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gate:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        # Both engines, because the declared support floor is Windows PowerShell
        # 5.1 and the code carries real 5.1-specific workarounds - the reduced
        # schema validator, the hand-written argument quoting, three places that
        # handle an empty array unwrapping to $null. Testing only 7 would leave the
        # floor unexercised, and only 5.1 would let a 7-only construct through.
        shell: [powershell, pwsh]
    name: ${{ matrix.shell }}
    steps:
      - uses: actions/checkout@v4

      - name: Install the test-only dependencies
        shell: ${{ matrix.shell }}
        run: |
          Set-PSRepository -Name PSGallery -InstallationPolicy Trusted
          Install-Module Pester -MinimumVersion 5.5 -Scope CurrentUser -Force -SkipPublisherCheck
          Install-Module PSScriptAnalyzer -Scope CurrentUser -Force

      - name: Seed the deny-term layer of the secret gate
        shell: ${{ matrix.shell }}
        env:
          SENSITIVE_TERMS: ${{ secrets.SENSITIVE_TERMS }}
        run: |
          # The gate has two layers and the second reads .local/sensitive-terms.txt,
          # which is excluded from version control - so it can never simply be
          # present here. Terms are themselves sensitive, hence a secret rather than
          # a committed file. Optional on purpose: a fork with no secret still runs
          # the structural layer, and the gate now says which layers answered rather
          # than reporting an unqualified pass.
          New-Item -ItemType Directory -Force -Path .local | Out-Null
          if ($env:SENSITIVE_TERMS) {
            [System.IO.File]::WriteAllText("$PWD/.local/sensitive-terms.txt", $env:SENSITIVE_TERMS)
            Write-Output 'Deny-term layer seeded from the SENSITIVE_TERMS secret.'
            Add-Content -Path $env:GITHUB_ENV -Value 'REQUIRE_DENY_TERMS=1'
          }
          else {
            Write-Output 'No SENSITIVE_TERMS secret set: the gate will run its structural rules only, and will say so.'
          }

      - name: Run the quality gate
        shell: ${{ matrix.shell }}
        run: |
          # One command, the same one a person runs locally. If this file ever grows
          # its own checks, the claim it exists to make stops being true.
          if ($env:REQUIRE_DENY_TERMS) {
            ./scripts/Invoke-Tests.ps1 -RequireDenyTerms
          }
          else {
            ./scripts/Invoke-Tests.ps1
          }

      - name: Prove the automations still validate offline
        shell: ${{ matrix.shell }}
        run: |
          # validate needs no network and no credential, so it is the one end-to-end
          # path that can run here. It also proves the shipped templates parse under
          # this engine, which is where the reduced 5.1 validator differs.
          ./automations/job-inventory/Invoke-JobInventory.ps1   -Command validate -ConfigurationPath ./automations/job-inventory/config/jobs.example.json
          ./automations/pipeline-drift/Invoke-PipelineDrift.ps1 -Command validate -ConfigurationPath ./automations/pipeline-drift/config/pipelines.example.json
          ./automations/jira-inventory/Invoke-JiraInventory.ps1 -Command validate -ConfigurationPath ./automations/jira-inventory/config/issues.example.json
